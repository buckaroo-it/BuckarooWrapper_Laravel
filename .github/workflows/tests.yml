name: Tests

on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '11' }
          - { php: '8.4', laravel: '11' }
          - { php: '8.3', laravel: '12' }
          - { php: '8.4', laravel: '12' }
          - { php: '8.5', laravel: '12' }
          - { php: '8.3', laravel: '13' }
          - { php: '8.4', laravel: '13' }
          - { php: '8.5', laravel: '13' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pcre, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      # Every Laravel 11 release has a security advisory, and Composer refuses those by default.
      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:^${{ matrix.laravel }}" --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Run tests
        run: composer test
